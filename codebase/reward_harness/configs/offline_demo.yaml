schema_version: rlar.config.v1
run_label: synthetic-offline-demo
profile_kind: offline_demo
data:
  input_path: ../examples/queries.jsonl
  task_pack_root: ../examples/task_packs
  split: train
  output_layout: reference
construction:
  strategy: agentic
  reward_mode: checklist
  allow_row_mode_override: false
  on_pass: submit
  candidate_selector: best_metric_then_reward_key
  selector_metric: false_accept_rate
  seed: 0
  reuse_enabled: true
  library_mode: continual
  max_components: 4
model:
  provider_adapter: scripted
  model: offline-fixture
  revision: fixture-v1
  scripted_responses: ../examples/scripted_responses.json
  max_output_tokens: 4096
  context_limit_tokens: 131072
  context_reserve_tokens: 8000
  connect_timeout_s: 2
  read_timeout_s: 5
  total_timeout_s: 10
execution:
  runner_type: subprocess
  runner_profile: prototype
  runtime_fingerprint: python-stdlib-fixture-v1
  wall_timeout_s: 2
  cpu_timeout_s: 2
  memory_limit_mb: 512
  max_processes: null
  max_output_bytes: 16384
  max_return_bytes: 131072
  allow_untrusted_code: false
  max_concurrent_actions: 4
rm:
  enabled: false
  catalogue: []
budget:
  run: {controller_steps: 20, revisions: 15, tool_calls: 40, test_cases: 200, component_executions: 500, model_requests: 40, scoring_requests: 20, input_tokens: 1000000, output_tokens: 200000}
  episode: {controller_steps: 5, revisions: 4, tool_calls: 10, test_cases: 60, component_executions: 120, model_requests: 10, scoring_requests: 8, input_tokens: 300000, output_tokens: 50000}
  retry: {max_transport_attempts: 3, backoff_initial_s: 0.01, backoff_multiplier: 2, backoff_max_s: 0.1, circuit_breaker_threshold: 3}
  no_progress_threshold: 3
  wall_deadline_s: 300
  per_tool_timeout_s: 30
validation:
  dev_suite_root: ../examples/dev_suites
  audit_suite_root: ../examples/audit_suites
  oracle_version: fixture-oracle-v1
  audit_required_assurance: isolated
logging:
  max_observation_chars: 8000
  max_blob_bytes: 4000000
  single_writer_lock: true
