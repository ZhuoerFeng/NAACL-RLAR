[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlar-harness"
version = "0.1.0"
description = "RLAR streaming reward-construction harness (offline P0)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.7,<3",
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.3",
]
parquet = [
  "pyarrow>=16",
]

[project.scripts]
rlar-harness = "rlar_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rlar_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
timeout = 300
markers = [
  "acceptance: maps to a P0 acceptance-matrix ID (AT-xx)",
  "slow: spawns real subprocesses / kills processes",
  "requires_real_service: needs an operator-supplied endpoint; skipped offline and never counted as passing",
]
